[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-sentry"
version = "1.0.0"
description = "Static, explainable phishing triage for email files"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
msg = ["extract-msg>=0.48"]

[project.scripts]
mail-sentry = "mail_sentry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mail_sentry = ["default_rules.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-sentry"
version = "2.0.0"
description = "Static, explainable phishing triage for email files"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
msg = ["extract-msg>=0.48"]
auth = ["dkimpy>=1.1", "pyspf>=2.0.14", "dnspython>=2.4"]
lang = ["langdetect>=1.0.9"]
archives = ["py7zr>=1.0", "cabarchive>=0.2.4", "pycdlib>=1.14", "rarfile>=4.1"]

[project.scripts]
mail-sentry = "mail_sentry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mail_sentry = ["default_rules.json", "lures/*.json"]
